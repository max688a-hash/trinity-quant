name: TRINITY QUANT & UIQC Supreme Quality Gate (GHA CI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  strict-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Single-File <= 300 Lines Law Physical Audit
        run: |
          echo "🔍 [GHA] Scanning repository for Single-File <= 300 Lines Law..."
          python -c "
          import glob, sys
          overs = []
          for p in glob.glob('**/*.py', recursive=True):
              if '.venv' in p or '.git' in p or '__pycache__' in p:
                  continue
              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = len(f.readlines())
                  if lines > 300:
                      overs.append((p, lines))
          if overs:
              print('❌ [GHA FAILED] Files exceeding 300 lines limit:')
              for p, l in overs:
                  print(f'   {p}: {l} lines')
              sys.exit(1)
          print('🟢 [GHA PASS] All Python files strictly comply with <= 300 lines law!')
          "

      - name: Step 2 - Anti-Tofu-Dreg Craftsmanship Inspection
        run: |
          echo "🔍 [GHA] Running Craftsmanship Execution Guard (Zero silent errors, zero mutable defaults)..."
          python -c "
          from universal_quality_engine.craftsmanship_execution_guard import CraftsmanshipExecutionGuard
          rep = CraftsmanshipExecutionGuard.audit_workspace_craftsmanship('.')
          if not rep.is_certified:
              print(f'❌ [GHA FAILED] Violations: {rep.tofu_dreg_violations}')
              sys.exit(1)
          print(f'🟢 [GHA PASS] Full repo certified Grade AAA Fortress!')
          "

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend production build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Step 3 - Run Full Unit Tests
        run: |
          echo "🧪 [GHA] Executing full unit test suite..."
          python -m unittest discover -s tests -p "test_*.py"

      - name: Step 4 - Strict Constitutional Invariants Verification
        run: |
          echo "⚖️ [GHA] Verifying Strict Constitutional Invariants & Anti-Cheating Gates..."
          python -m unittest tests/test_constitution_strict.py

      - name: Step 5 - Constitution Vault Self-Check
        run: |
          echo "🏛️ [GHA] Verifying Constitution Vault & Rule Integrity..."
          python scripts/constitution_vault.py
